[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-game-bench"
version = "0.1.0"
description = "SWEGameBench: an executable benchmark for automated program repair on Unity game repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
enrich = ["openai>=1.30"]

[project.scripts]
swe-game-bench = "swe_game_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
