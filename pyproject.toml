[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-game-agent"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "pydantic>=2",
    "pyyaml",
    "tenacity",
]

[project.scripts]
game-agent = "game_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
