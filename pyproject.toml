[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-game-agent"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["mini-swe-agent==2.4.6", "pydantic>=2", "pyyaml"]

[project.scripts]
game-agent = "game_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
